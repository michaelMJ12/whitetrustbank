{% load static %}
<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0B1220" />

<title>{% block title %}whitetrustltd.com{% endblock %}</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<script src="https://cdn.tailwindcss.com"></script>
{% block chartjs %}{% endblock %}

<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        ink: "#0B1220",
        teal: { DEFAULT: "#0F5C4E", light: "#17836F", dark: "#0A3F35" },
        gold: "#C9A227",
        paper: "#F7F5EF",
        mist: "#E9E4D8",
        slate: { 450: "#5B6472" },
      },
      fontFamily: {
        display: ["'Space Grotesk'", "sans-serif"],
        body: ["Inter", "sans-serif"]
      },
    },
  },
};
</script>

<style>
body {
  font-family: 'Inter', sans-serif;
}

.font-display {
  font-family: 'Space Grotesk', sans-serif;
}

html {
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
  scroll-behavior: smooth;
}

body {
  overflow-x: hidden;
  -webkit-tap-highlight-color: transparent;
}

img, canvas {
  max-width: 100%;
}

a, button, select, label {
  touch-action: manipulation;
}

body .min-h-screen {
  min-height: 100vh;
}

@supports (height: 100dvh) {
  body .min-h-screen {
    min-height: 100dvh;
  }

  body .h-screen {
    height: 100dvh;
  }
}

.no-scrollbar {
  scrollbar-width: none;
  -ms-overflow-style: none;
}

.no-scrollbar::-webkit-scrollbar {
  display: none;
}

section[id] {
  scroll-margin-top: 7rem;
}

main [id] {
  scroll-margin-top: 5rem;
}

@media (max-width: 1023px) {
  main [id] {
    scroll-margin-top: 8rem;
  }
}

#tx-mount,
#activity-mount,
[id$="alltx-mount"],
[id$="accounts-mount"],
[id$="pending-mount"],
[id$="Table-mount"],
[id$="Table-mount-ov"] {
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
}

@media (max-width: 767px) {
  #tx-mount table,
  #activity-mount table,
  [id$="alltx-mount"] table,
  [id$="accounts-mount"] table,
  [id$="pending-mount"] table {
    min-width: 38rem;
  }
}

@media (max-width: 640px) {
  input, select, textarea {
    font-size: 16px !important;
  }
}

@media (pointer: coarse) {
  td button,
  #ov-live-list button,
  #live-list button,
  #freeze-toggle {
    min-height: 38px;
  }
}

/* Language dropdown */
.lang-select {
  text-overflow: ellipsis;
}

.lang-select option {
  color: #0B1220;
  background: #ffffff;
}

/* Legacy Google Translate styling */
.goog-te-banner-frame,
.skiptranslate > iframe,
#goog-gt-tt,
.goog-te-balloon-frame {
  display: none !important;
}

body {
  top: 0 !important;
}

.goog-text-highlight {
  background: none !important;
  box-shadow: none !important;
}

#google_translate_element {
  display: none;
}

@media (max-width: 640px) {
  .hero-background {
    background-position: 58% center !important;
  }
}

@media (prefers-reduced-motion: reduce) {
  html {
    scroll-behavior: auto;
  }
}

{% block extra_style %}{% endblock %}
</style>

{% block extra_head %}{% endblock %}
</head>

<body class="{% block body_class %}bg-paper text-ink{% endblock %}">

{% block content %}{% endblock %}

<div id="google_translate_element"></div>

<script>
/* =====================================================
   LANGUAGES
   Existing Asian languages + Europe + Americas
===================================================== */

const LANGS = [

  /* English */
  { code: 'en', name: 'English' },

  /* =====================================================
     ASIA - EXISTING LANGUAGES
  ===================================================== */

  { code: 'zh-CN', name: 'Chinese (Simplified)' },
  { code: 'zh-TW', name: 'Chinese (Traditional)' },
  { code: 'ja', name: 'Japanese' },
  { code: 'ko', name: 'Korean' },
  { code: 'mn', name: 'Mongolian' },

  { code: 'id', name: 'Indonesian' },
  { code: 'ms', name: 'Malay' },
  { code: 'tl', name: 'Filipino' },
  { code: 'th', name: 'Thai' },
  { code: 'vi', name: 'Vietnamese' },
  { code: 'km', name: 'Khmer' },
  { code: 'lo', name: 'Lao' },
  { code: 'my', name: 'Burmese' },

  { code: 'hi', name: 'Hindi' },
  { code: 'bn', name: 'Bengali' },
  { code: 'ur', name: 'Urdu' },
  { code: 'ta', name: 'Tamil' },
  { code: 'te', name: 'Telugu' },
  { code: 'mr', name: 'Marathi' },
  { code: 'gu', name: 'Gujarati' },
  { code: 'kn', name: 'Kannada' },
  { code: 'ml', name: 'Malayalam' },
  { code: 'pa', name: 'Punjabi' },
  { code: 'or', name: 'Odia' },
  { code: 'as', name: 'Assamese' },
  { code: 'sd', name: 'Sindhi' },
  { code: 'ne', name: 'Nepali' },
  { code: 'si', name: 'Sinhala' },
  { code: 'dv', name: 'Dhivehi' },

  { code: 'kk', name: 'Kazakh' },
  { code: 'uz', name: 'Uzbek' },
  { code: 'ky', name: 'Kyrgyz' },
  { code: 'tg', name: 'Tajik' },
  { code: 'tk', name: 'Turkmen' },
  { code: 'az', name: 'Azerbaijani' },
  { code: 'ka', name: 'Georgian' },
  { code: 'hy', name: 'Armenian' },

  { code: 'ar', name: 'Arabic' },
  { code: 'fa', name: 'Persian' },
  { code: 'iw', name: 'Hebrew' },
  { code: 'tr', name: 'Turkish' },
  { code: 'ku', name: 'Kurdish' },
  { code: 'ps', name: 'Pashto' },

  /* =====================================================
     EUROPE
  ===================================================== */

  { code: 'sq', name: 'Albanian' },
  { code: 'ca', name: 'Catalan' },
  { code: 'be', name: 'Belarusian' },
  { code: 'nl', name: 'Dutch' },
  { code: 'fr', name: 'French' },
  { code: 'de', name: 'German' },
  { code: 'bs', name: 'Bosnian' },
  { code: 'hr', name: 'Croatian' },
  { code: 'sr', name: 'Serbian' },
  { code: 'bg', name: 'Bulgarian' },
  { code: 'el', name: 'Greek' },
  { code: 'cs', name: 'Czech' },
  { code: 'da', name: 'Danish' },
  { code: 'et', name: 'Estonian' },
  { code: 'fi', name: 'Finnish' },
  { code: 'hu', name: 'Hungarian' },
  { code: 'is', name: 'Icelandic' },
  { code: 'ga', name: 'Irish' },
  { code: 'it', name: 'Italian' },
  { code: 'lv', name: 'Latvian' },
  { code: 'lt', name: 'Lithuanian' },
  { code: 'lb', name: 'Luxembourgish' },
  { code: 'mt', name: 'Maltese' },
  { code: 'ro', name: 'Romanian' },
  { code: 'mk', name: 'Macedonian' },
  { code: 'no', name: 'Norwegian' },
  { code: 'pl', name: 'Polish' },
  { code: 'pt', name: 'Portuguese' },
  { code: 'ru', name: 'Russian' },
  { code: 'sk', name: 'Slovak' },
  { code: 'sl', name: 'Slovenian' },
  { code: 'es', name: 'Spanish' },
  { code: 'sv', name: 'Swedish' },
  { code: 'uk', name: 'Ukrainian' },

  /* =====================================================
     NORTH AMERICA, CENTRAL AMERICA & CARIBBEAN
  ===================================================== */

  { code: 'ht', name: 'Haitian Creole' }

];


/* =====================================================
   RIGHT-TO-LEFT LANGUAGES
===================================================== */

const RTL = [
  'ar',
  'fa',
  'ur',
  'iw',
  'ps',
  'sd',
  'dv',
  'ku'
];


/* =====================================================
   BROWSER LANGUAGE DETECTION
===================================================== */

function guessLangFromBrowser() {

  const raw = (navigator.language || 'en').toLowerCase();

  if (raw.startsWith('zh')) {
    return (
      raw.includes('tw') ||
      raw.includes('hk') ||
      raw.includes('mo') ||
      raw.includes('hant')
    ) ? 'zh-TW' : 'zh-CN';
  }

  const base = raw.split('-')[0];

  const alias = {
    he: 'iw',
    fil: 'tl',
    nb: 'no',
    nn: 'no'
  };

  const code = alias[base] || base;

  return LANGS.some(lang => lang.code === code)
    ? code
    : 'en';
}


/* =====================================================
   COOKIE HELPERS
===================================================== */

function setCookie(value) {

  const host = location.hostname;

  document.cookie = `googtrans=${value}; path=/; SameSite=Lax`;

  document.cookie =
    `googtrans=${value}; path=/; domain=${host}; SameSite=Lax`;
}


function clearCookie() {

  const host = location.hostname;

  const past = 'expires=Thu, 01 Jan 1970 00:00:00 GMT';

  document.cookie = `googtrans=; path=/; ${past}`;

  document.cookie =
    `googtrans=; path=/; domain=${host}; ${past}`;
}


/* =====================================================
   GET CURRENT LANGUAGE
===================================================== */

function currentLang() {

  const match = document.cookie.match(
    /(?:^|;\s*)googtrans=\/[^/]+\/([^;]+)/
  );

  return match
    ? decodeURIComponent(match[1])
    : (localStorage.getItem('wtb_lang') || 'en');
}


/* =====================================================
   APPLY LANGUAGE DIRECTION
===================================================== */

function applyDirection(code) {

  document.documentElement.setAttribute(
    'dir',
    RTL.includes(code) ? 'rtl' : 'ltr'
  );

  document.documentElement.setAttribute(
    'lang',
    code === 'iw' ? 'he' : code
  );
}


/* =====================================================
   CHANGE LANGUAGE
===================================================== */

function changeLanguage(code) {

  if (!LANGS.some(lang => lang.code === code)) {
    return;
  }

  localStorage.setItem('wtb_lang', code);

  if (code === 'en') {
    clearCookie();
  } else {
    setCookie('/en/' + code);
  }

  applyDirection(code);

  location.reload();
}


/* =====================================================
   REGIONAL DEFAULT - FIRST VISIT ONLY
===================================================== */

(function regionalDefault() {

  if (localStorage.getItem('wtb_lang') !== null) {
    return;
  }

  if (/(?:^|;\s*)googtrans=/.test(document.cookie)) {
    return;
  }

  const guess = guessLangFromBrowser();

  localStorage.setItem('wtb_lang', guess);

  if (guess !== 'en') {
    setCookie('/en/' + guess);
    location.reload();
  }

})();


/* =====================================================
   GOOGLE TRANSLATE INITIALIZATION
   Legacy integration retained for compatibility.
===================================================== */

window.googleTranslateElementInit = function () {

  if (
    !window.google ||
    !google.translate ||
    !google.translate.TranslateElement
  ) {
    return;
  }

  new google.translate.TranslateElement({

    pageLanguage: 'en',

    includedLanguages: LANGS
      .filter(lang => lang.code !== 'en')
      .map(lang => lang.code)
      .join(','),

    autoDisplay: false

  }, 'google_translate_element');

};


/* =====================================================
   LANGUAGE DROPDOWN
===================================================== */

document.addEventListener('DOMContentLoaded', function () {

  let selects = Array.from(
    document.querySelectorAll('.lang-select')
  );

  /*
    Fallback:
    Pages without a header dropdown get a floating selector.
  */

  if (!selects.length) {

    const wrap = document.createElement('div');

    wrap.className = 'notranslate fixed left-4 z-[60]';

    wrap.style.bottom =
      'calc(1rem + env(safe-area-inset-bottom))';

    wrap.setAttribute('translate', 'no');

    wrap.innerHTML = `
      <label class="flex items-center gap-2 bg-white/95 backdrop-blur border border-mist shadow-lg rounded-full pl-3 pr-2 py-1.5">

        <svg width="16" height="16" viewBox="0 0 24 24"
          fill="none" aria-hidden="true">

          <circle cx="12" cy="12" r="9"
            stroke="#0F5C4E" stroke-width="1.7"/>

          <path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z"
            stroke="#0F5C4E" stroke-width="1.5"/>

        </svg>

        <select
          class="lang-select text-sm text-ink bg-transparent outline-none cursor-pointer max-w-[9rem]"
          aria-label="Language">
        </select>

      </label>
    `;

    document.body.appendChild(wrap);

    selects = Array.from(
      wrap.querySelectorAll('.lang-select')
    );
  }


  const cur = currentLang();

  const value = LANGS.some(lang => lang.code === cur)
    ? cur
    : 'en';


  const options = LANGS.map(lang => {

    return `<option value="${lang.code}">${lang.name}</option>`;

  }).join('');


  selects.forEach(select => {

    select.innerHTML = options;

    select.value = value;

    select.addEventListener('change', function () {

      changeLanguage(this.value);

    });

  });


  applyDirection(value);

});
</script>


<!-- Legacy Google Translate widget script -->
<script
  src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"
  async>
</script>


<!-- Existing application JavaScript -->
<script src="{% static 'js/app.js' %}"></script>

{% block extra_scripts %}{% endblock %}

</body>
</html>
