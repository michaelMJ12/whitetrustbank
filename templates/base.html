{% load static %}<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0B1220" />
<title>{% block title %}whitetrustltd.com{% endblock %}</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<!-- Tailwind (CDN build for prototyping — swap for a compiled build + django-tailwind in production) -->
<script src="https://cdn.tailwindcss.com"></script>
{% block chartjs %}{% endblock %}
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          ink: "#0B1220",
          teal: { DEFAULT: "#0F5C4E", light: "#17836F", dark: "#0A3F35" },
          gold: "#C9A227",
          paper: "#F7F5EF",
          mist: "#E9E4D8",
          slate: { 450: "#5B6472" },
        },
        fontFamily: { display: ["'Space Grotesk'", "sans-serif"], body: ["Inter", "sans-serif"] },
      },
    },
  };
</script>
<style>
  body { font-family: 'Inter', sans-serif; }
  .font-display { font-family: 'Space Grotesk', sans-serif; }

  /* ================= Mobile / responsive foundation ================= */
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; scroll-behavior: smooth; }
  body { overflow-x: hidden; -webkit-tap-highlight-color: transparent; }
  img, canvas { max-width: 100%; }
  a, button, select, label { touch-action: manipulation; }

  /* Real full-height on mobile browsers (address bar collapsing) */
  body .min-h-screen { min-height: 100vh; }
  @supports (height: 100dvh) {
    body .min-h-screen { min-height: 100dvh; }
    body .h-screen { height: 100dvh; }
  }

  /* Hide scrollbars on swipeable chip bars */
  .no-scrollbar { scrollbar-width: none; -ms-overflow-style: none; }
  .no-scrollbar::-webkit-scrollbar { display: none; }

  /* Anchor targets sit below the sticky/fixed headers */
  section[id] { scroll-margin-top: 7rem; }
  main [id] { scroll-margin-top: 5rem; }
  @media (max-width: 1023px) { main [id] { scroll-margin-top: 8rem; } }

  /* Wide data tables scroll sideways instead of being crushed */
  #tx-mount, #activity-mount,
  [id$="alltx-mount"], [id$="accounts-mount"], [id$="pending-mount"],
  [id$="Table-mount"], [id$="Table-mount-ov"] {
    overflow-x: auto; -webkit-overflow-scrolling: touch;
  }
  @media (max-width: 767px) {
    #tx-mount table, #activity-mount table,
    [id$="alltx-mount"] table, [id$="accounts-mount"] table, [id$="pending-mount"] table { min-width: 38rem; }
  }

  /* Phones: 16px form controls stop iOS from zooming the page on focus */
  @media (max-width: 640px) {
    input, select, textarea { font-size: 16px !important; }
  }

  /* Touch devices: comfortable tap targets for small pill buttons */
  @media (pointer: coarse) {
    td button, #ov-live-list button, #live-list button, #freeze-toggle { min-height: 38px; }
  }

  /* Language dropdown */
  .lang-select { text-overflow: ellipsis; }
  .lang-select option { color: #0B1220; background: #ffffff; }

  /* Hide Google's default toolbar/branding so only our dropdown shows */
  .goog-te-banner-frame, .skiptranslate > iframe, #goog-gt-tt, .goog-te-balloon-frame { display: none !important; }
  body { top: 0 !important; }
  .goog-text-highlight { background: none !important; box-shadow: none !important; }
  #google_translate_element { display: none; }

  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
  }

  {% block extra_style %}{% endblock %}
</style>
{% block extra_head %}{% endblock %}
</head>
<body class="{% block body_class %}bg-paper text-ink{% endblock %}">
{% block content %}{% endblock %}

<div id="google_translate_element"></div>

<script>
  /* ================= Languages (Asia) ================= */
  const LANGS = [
    { code: 'en',    name: 'English' },
    // East Asia
    { code: 'zh-CN', name: '简体中文 (Chinese, Simplified)' },
    { code: 'zh-TW', name: '繁體中文 (Chinese, Traditional)' },
    { code: 'ja',    name: '日本語 (Japanese)' },
    { code: 'ko',    name: '한국어 (Korean)' },
    { code: 'mn',    name: 'Монгол (Mongolian)' },
    // Southeast Asia
    { code: 'id',    name: 'Bahasa Indonesia' },
    { code: 'ms',    name: 'Bahasa Melayu (Malay)' },
    { code: 'tl',    name: 'Filipino' },
    { code: 'th',    name: 'ไทย (Thai)' },
    { code: 'vi',    name: 'Tiếng Việt (Vietnamese)' },
    { code: 'km',    name: 'ខ្មែរ (Khmer)' },
    { code: 'lo',    name: 'ລາວ (Lao)' },
    { code: 'my',    name: 'မြန်မာ (Burmese)' },
    // South Asia
    { code: 'hi',    name: 'हिन्दी (Hindi)' },
    { code: 'bn',    name: 'বাংলা (Bengali)' },
    { code: 'ur',    name: 'اردو (Urdu)' },
    { code: 'ta',    name: 'தமிழ் (Tamil)' },
    { code: 'te',    name: 'తెలుగు (Telugu)' },
    { code: 'mr',    name: 'मराठी (Marathi)' },
    { code: 'gu',    name: 'ગુજરાતી (Gujarati)' },
    { code: 'kn',    name: 'ಕನ್ನಡ (Kannada)' },
    { code: 'ml',    name: 'മലയാളം (Malayalam)' },
    { code: 'pa',    name: 'ਪੰਜਾਬੀ (Punjabi)' },
    { code: 'or',    name: 'ଓଡ଼ିଆ (Odia)' },
    { code: 'as',    name: 'অসমীয়া (Assamese)' },
    { code: 'sd',    name: 'سنڌي (Sindhi)' },
    { code: 'ne',    name: 'नेपाली (Nepali)' },
    { code: 'si',    name: 'සිංහල (Sinhala)' },
    { code: 'dv',    name: 'ދިވެހި (Dhivehi)' },
    // Central Asia & Caucasus
    { code: 'kk',    name: 'Қазақша (Kazakh)' },
    { code: 'uz',    name: 'Oʻzbekcha (Uzbek)' },
    { code: 'ky',    name: 'Кыргызча (Kyrgyz)' },
    { code: 'tg',    name: 'Тоҷикӣ (Tajik)' },
    { code: 'tk',    name: 'Türkmençe (Turkmen)' },
    { code: 'az',    name: 'Azərbaycanca (Azerbaijani)' },
    { code: 'ka',    name: 'ქართული (Georgian)' },
    { code: 'hy',    name: 'Հայերեն (Armenian)' },
    // West Asia
    { code: 'ar',    name: 'العربية (Arabic)' },
    { code: 'fa',    name: 'فارسی (Persian)' },
    { code: 'iw',    name: 'עברית (Hebrew)' },
    { code: 'tr',    name: 'Türkçe (Turkish)' },
    { code: 'ku',    name: 'Kurdî (Kurdish)' },
    { code: 'ps',    name: 'پښتو (Pashto)' },
  ];
  const RTL = ['ar', 'fa', 'ur', 'iw', 'ps', 'sd', 'dv', 'ku'];

  /* Browser-language -> supported code, used only for the first-visit regional default */
  function guessLangFromBrowser() {
    const raw = (navigator.language || 'en').toLowerCase();
    if (raw.startsWith('zh')) return (raw.includes('tw') || raw.includes('hk') || raw.includes('mo') || raw.includes('hant')) ? 'zh-TW' : 'zh-CN';
    const base = raw.split('-')[0];
    const alias = { he: 'iw', fil: 'tl' };
    const code = alias[base] || base;
    return LANGS.some(l => l.code === code) ? code : 'en';
  }

  /* ================= Cookie helpers ================= */
  function setCookie(value) {
    const host = location.hostname;
    document.cookie = `googtrans=${value}; path=/`;
    document.cookie = `googtrans=${value}; path=/; domain=${host}`;
  }
  function clearCookie() {
    const host = location.hostname;
    const past = 'expires=Thu, 01 Jan 1970 00:00:00 GMT';
    document.cookie = `googtrans=; path=/; ${past}`;
    document.cookie = `googtrans=; path=/; domain=${host}; ${past}`;
  }
  function currentLang() {
    const m = document.cookie.match(/(?:^|;\s*)googtrans=\/[^/]+\/([^;]+)/);
    return m ? decodeURIComponent(m[1]) : (localStorage.getItem('wtb_lang') || 'en');
  }
  function applyDirection(code) {
    document.documentElement.setAttribute('dir', RTL.includes(code) ? 'rtl' : 'ltr');
    document.documentElement.setAttribute('lang', code === 'iw' ? 'he' : code);
  }
  function changeLanguage(code) {
    localStorage.setItem('wtb_lang', code);
    if (code === 'en') clearCookie(); else setCookie('/en/' + code);
    applyDirection(code);
    location.reload();   // reload so every dynamic widget is re-rendered and translated cleanly
  }

  /* ================= Regional default (first visit only) ================= */
  (function regionalDefault() {
    if (localStorage.getItem('wtb_lang') !== null) return;      // visitor already chose / was auto-set
    if (/(?:^|;\s*)googtrans=/.test(document.cookie)) return;    // a translation is already active
    const guess = guessLangFromBrowser();
    localStorage.setItem('wtb_lang', guess);                     // set first => no reload loop
    if (guess !== 'en') { setCookie('/en/' + guess); location.reload(); }
  })();

  /* ================= Google Translate engine ================= */
  function googleTranslateElementInit() {
    new google.translate.TranslateElement({
      pageLanguage: 'en',
      includedLanguages: LANGS.filter(l => l.code !== 'en').map(l => l.code).join(','),
      autoDisplay: false,
    }, 'google_translate_element');
  }

  /* ================= Dropdown wiring ================= */
  document.addEventListener('DOMContentLoaded', function () {
    let selects = Array.from(document.querySelectorAll('.lang-select'));

    // Fallback: pages without a header dropdown (e.g. login) get a floating one
    if (!selects.length) {
      const wrap = document.createElement('div');
      wrap.className = 'notranslate fixed left-4 z-[60]';
      wrap.style.bottom = 'calc(1rem + env(safe-area-inset-bottom))';
      wrap.setAttribute('translate', 'no');
      wrap.innerHTML = `
        <label class="flex items-center gap-2 bg-white/95 backdrop-blur border border-mist shadow-lg rounded-full pl-3 pr-2 py-1.5">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="9" stroke="#0F5C4E" stroke-width="1.7"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z" stroke="#0F5C4E" stroke-width="1.5"/></svg>
          <select class="lang-select text-sm text-ink bg-transparent outline-none cursor-pointer max-w-[9rem]" aria-label="Language"></select>
        </label>`;
      document.body.appendChild(wrap);
      selects = Array.from(wrap.querySelectorAll('.lang-select'));
    }

    const cur = currentLang();
    const value = LANGS.some(l => l.code === cur) ? cur : 'en';
    const options = LANGS.map(l => `<option value="${l.code}">${l.name}</option>`).join('');
    selects.forEach((sel) => {
      sel.innerHTML = options;
      sel.value = value;
      sel.addEventListener('change', () => changeLanguage(sel.value));
    });
    applyDirection(value);
  });
</script>
<script src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit" async></script>

<script src="{% static 'js/app.js' %}"></script>
{% block extra_scripts %}{% endblock %}
</body>
</html>
