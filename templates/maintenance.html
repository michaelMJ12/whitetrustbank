<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Maintenance</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .box {
            background: white;
            padding: 40px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            max-width: 450px;
        }
        h1 { color: #1a3a5c; }
        p  { color: #555; line-height: 1.6; }
    </style>
</head>
<body>
    <div class="box">
        <h1>🛠️ System Under Maintenance</h1>
        <p>{{ error|default:"System is temporarily down for maintenance. Please check back soon, or call Engr Rotimi for Maintenance." }}</p>
    </div>
</body>
</html>
